<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Smart Home Visualization Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 250px;
            margin-bottom: 10px;
        }

        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .sensor-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .sensor-item.warning {
            border-left-color: #ffc107;
        }

        .sensor-item.danger {
            border-left-color: #dc3545;
        }

        .sensor-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .sensor-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }

        .sensor-unit {
            font-size: 12px;
            color: #667eea;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .device-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e9ecef;
            cursor: pointer;
            transition: all 0.3s;
        }

        .device-card:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .device-card.active {
            border-color: #28a745;
            background: #d4edda;
        }

        .device-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .device-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .device-status {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .device-control {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-toggle {
            background: #667eea;
            color: white;
        }

        .btn-toggle:hover {
            background: #5568d3;
        }

        .btn-toggle.active {
            background: #28a745;
        }

        .slider-container {
            width: 100%;
            margin-top: 10px;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            text-align: center;
            font-size: 12px;
            color: #667eea;
            margin-top: 5px;
            font-weight: bold;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .stat {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🏠 Smart Home Dashboard</h1>
                <p style="color: #6c757d; margin-top: 5px;">Real-time Visualization & Control</p>
            </div>
            <div class="status-badge online" id="statusBadge">
                🟢 ONLINE
            </div>
        </div>

        <!-- Messages -->
        <div id="messageContainer"></div>

        <!-- Dashboard -->
        <div class="dashboard-grid" id="dashboardGrid">
            <!-- Sensors Overview -->
            <div class="card">
                <h3>📊 Sensor Data</h3>
                <div class="sensors-grid" id="sensorsGrid">
                    <div class="sensor-item">
                        <div class="sensor-label">Temperature</div>
                        <div class="sensor-value" id="tempValue">--</div>
                        <div class="sensor-unit">°C</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">Humidity</div>
                        <div class="sensor-value" id="humidValue">--</div>
                        <div class="sensor-unit">%</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">Light</div>
                        <div class="sensor-value" id="lightValue">--</div>
                        <div class="sensor-unit">lux</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">CO2</div>
                        <div class="sensor-value" id="co2Value">--</div>
                        <div class="sensor-unit">ppm</div>
                    </div>
                </div>
            </div>

            <!-- Temperature Trend -->
            <div class="card">
                <h3>🌡️ Temperature Trend (24h)</h3>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- Humidity Trend -->
            <div class="card">
                <h3>💧 Humidity Trend (24h)</h3>
                <div class="chart-container">
                    <canvas id="humidChart"></canvas>
                </div>
            </div>

            <!-- Devices Control -->
            <div class="card" style="grid-column: 1 / -1;">
                <h3>⚙️ Device Control</h3>
                <div class="devices-grid" id="devicesGrid">
                    <!-- Devices will be populated here -->
                </div>
            </div>

            <!-- Statistics -->
            <div class="card" style="grid-column: 1 / -1;">
                <h3>📈 Statistics</h3>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-label">Active Devices</div>
                        <div class="stat-value" id="activeDevices">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Active Sensors</div>
                        <div class="stat-value" id="activeSensors">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Last Update</div>
                        <div class="stat-value" id="lastUpdate">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Connection</div>
                        <div class="stat-value" id="connectionStatus">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:8000/api';
        const REFRESH_INTERVAL = 5000; // 5 seconds
        
        // Chart instances
        let tempChart, humidChart;

        // Data storage
        const sensorHistory = {
            temperature: [],
            humidity: []
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            initCharts();
            await loadDashboard();
            setInterval(loadDashboard, REFRESH_INTERVAL);
            initSocket();
        });

        // Initialize Socket.IO
        function initSocket() {
            try {
                const socket = io('http://localhost:8000', {
                    reconnection: true,
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: 5
                });

                socket.on('connect', () => {
                    console.log('✅ Socket connected');
                    updateConnectionStatus('Connected', '#28a745');
                });

                socket.on('disconnect', () => {
                    console.log('❌ Socket disconnected');
                    updateConnectionStatus('Disconnected', '#dc3545');
                });

                socket.on('sensor_update', (data) => {
                    console.log('📊 Sensor update:', data);
                    updateSensorDisplay(data);
                    addToChart(data);
                });

                socket.on('device_update', (data) => {
                    console.log('⚙️ Device update:', data);
                    updateDeviceDisplay(data);
                });
            } catch (e) {
                console.warn('Socket.IO not available:', e);
            }
        }

        // Initialize charts
        function initCharts() {
            const tempCtx = document.getElementById('tempChart').getContext('2d');
            tempChart = new Chart(tempCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#ff6b6b'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 15,
                            max: 35
                        }
                    }
                }
            });

            const humidCtx = document.getElementById('humidChart').getContext('2d');
            humidChart = new Chart(humidCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Humidity (%)',
                        data: [],
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#4ecdc4'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            min: 0,
                            max: 100
                        }
                    }
                }
            });
        }

        // Load dashboard data
        async function loadDashboard() {
            try {
                // Get devices
                const devicesRes = await fetch(`${API_URL}/devices/status`);
                const devicesData = await devicesRes.json();
                
                if (devicesData.success) {
                    displayDevices(devicesData.data || []);
                }

                // Get latest sensor data
                const sensorsRes = await fetch(`${API_URL}/sensors/latest`);
                const sensorsData = await sensorsRes.json();
                
                if (sensorsData.success) {
                    updateSensorValues(sensorsData.data || []);
                    updateStats(sensorsData.data || []);
                }
            } catch (e) {
                console.error('❌ Error loading dashboard:', e);
                showMessage('Lỗi kết nối với server', 'error');
            }
        }

        // Update sensor display
        function updateSensorDisplay(data) {
            if (data.sensor_type === 'temperature') {
                document.getElementById('tempValue').textContent = data.value.toFixed(1);
            } else if (data.sensor_type === 'humidity') {
                document.getElementById('humidValue').textContent = data.value.toFixed(1);
            } else if (data.sensor_type === 'light') {
                document.getElementById('lightValue').textContent = data.value.toFixed(0);
            } else if (data.sensor_type === 'co2') {
                document.getElementById('co2Value').textContent = data.value.toFixed(0);
            }
        }

        // Update sensor values from API
        function updateSensorValues(sensors) {
            sensors.forEach(sensor => {
                if (sensor.sensor_type === 'temperature') {
                    document.getElementById('tempValue').textContent = sensor.latest_value.toFixed(1);
                } else if (sensor.sensor_type === 'humidity') {
                    document.getElementById('humidValue').textContent = sensor.latest_value.toFixed(1);
                } else if (sensor.sensor_type === 'light') {
                    document.getElementById('lightValue').textContent = sensor.latest_value.toFixed(0);
                } else if (sensor.sensor_type === 'co2') {
                    document.getElementById('co2Value').textContent = sensor.latest_value.toFixed(0);
                }
            });
            
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('vi-VN');
        }

        // Add data to chart
        function addToChart(data) {
            const now = new Date().toLocaleTimeString('vi-VN');

            if (data.sensor_type === 'temperature') {
                tempChart.data.labels.push(now);
                tempChart.data.datasets[0].data.push(data.value);
                
                // Keep only last 24 points
                if (tempChart.data.labels.length > 24) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                tempChart.update('none');
            } else if (data.sensor_type === 'humidity') {
                humidChart.data.labels.push(now);
                humidChart.data.datasets[0].data.push(data.value);
                
                if (humidChart.data.labels.length > 24) {
                    humidChart.data.labels.shift();
                    humidChart.data.datasets[0].data.shift();
                }
                humidChart.update('none');
            }
        }

        // Display devices
        function displayDevices(devices) {
            const grid = document.getElementById('devicesGrid');
            grid.innerHTML = '';

            devices.forEach(device => {
                const icon = getDeviceIcon(device.device_type);
                const isActive = device.status === 'on';
                
                const card = document.createElement('div');
                card.className = `device-card ${isActive ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="device-icon">${icon}</div>
                    <div class="device-name">${device.device_name}</div>
                    <div class="device-status">${isActive ? '🟢 On' : '⚫ Off'}</div>
                    <div class="device-control">
                        <button class="btn btn-toggle ${isActive ? 'active' : ''}" 
                                onclick="toggleDevice(${device.device_id}, '${device.device_type}')">
                            ${isActive ? 'Tắt' : 'Bật'}
                        </button>
                    </div>
                    ${device.device_type === 'fan' || device.device_type === 'light' ? `
                        <div class="slider-container">
                            <input type="range" min="0" max="100" value="${device.level || 0}" 
                                   class="slider" onchange="setDeviceLevel(${device.device_id}, this.value)">
                            <div class="slider-value">${device.level || 0}%</div>
                        </div>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Update device display
        function updateDeviceDisplay(data) {
            const card = document.querySelector(`[data-device-id="${data.device_id}"]`);
            if (card) {
                card.classList.toggle('active', data.status === 'on');
            }
        }

        // Toggle device
        async function toggleDevice(deviceId, deviceType) {
            try {
                const res = await fetch(`${API_URL}/devices/${deviceId}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle' })
                });
                
                const data = await res.json();
                if (data.success) {
                    showMessage('✅ Thiết bị đã cập nhật', 'success');
                    await loadDashboard();
                }
            } catch (e) {
                console.error('Error toggling device:', e);
                showMessage('❌ Lỗi khi điều khiển thiết bị', 'error');
            }
        }

        // Set device level
        async function setDeviceLevel(deviceId, level) {
            try {
                const res = await fetch(`${API_URL}/devices/${deviceId}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'set_level', level: parseInt(level) })
                });
                
                const data = await res.json();
                if (data.success) {
                    showMessage(`✅ Mức độ set thành ${level}%`, 'success');
                }
            } catch (e) {
                console.error('Error setting level:', e);
            }
        }

        // Update statistics
        function updateStats(sensors) {
            const activeDevices = document.querySelectorAll('.device-card.active').length;
            document.getElementById('activeSensors').textContent = sensors.length;
        }

        // Get device icon
        function getDeviceIcon(type) {
            const icons = {
                'light': '💡',
                'fan': '🌀',
                'relay': '🔌',
                'switch': '⚡',
                'sensor': '📊'
            };
            return icons[type] || '⚙️';
        }

        // Update connection status
        function updateConnectionStatus(status, color) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = status;
            badge.style.backgroundColor = color + '33';
            badge.style.color = color;
        }

        // Show message
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const div = document.createElement('div');
            div.className = `${type}-message`;
            div.textContent = text;
            container.appendChild(div);
            
            setTimeout(() => div.remove(), 3000);
        }
    </script>
</body>
</html>
